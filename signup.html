<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #218838; }
        p { text-align: center; font-size: 14px; }
        a { color: #28a745; text-decoration: none; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Create Account</h2>
    <form id="signupForm">
        <input type="text" id="userId" placeholder="Choose User ID" required>
        <input type="password" id="password" placeholder="Choose Password" required>
        <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a href="/index.html">Login here</a></p>
</div>

<script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const userId = document.getElementById('userId').value;
        const password = document.getElementById('password').value;

        const response = await fetch('/api/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, password })
        });

        const data = await response.json();
        alert(data.message);
        if (response.ok) window.location.href = '/index.html'; // Redirect to login on success
    });
</script>

</body>
</html>
